<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d9f2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7cc4ef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#sky)" rx="115"/>
  
  <!-- Tail strings -->
  <path d="M 256 380 Q 240 420 220 440" stroke="#0f2f57" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 256 380 Q 270 420 292 445" stroke="#0f2f57" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Bows on tail -->
  <g transform="translate(220,440) rotate(-20)">
    <ellipse cx="0" cy="0" rx="14" ry="8" fill="#ffd54f" stroke="#d97706" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="8" ry="5" fill="#f59e0b"/>
  </g>
  <g transform="translate(292,445) rotate(20)">
    <ellipse cx="0" cy="0" rx="14" ry="8" fill="#ffd54f" stroke="#d97706" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="8" ry="5" fill="#f59e0b"/>
  </g>
  <g transform="translate(256,465) rotate(0)">
    <ellipse cx="0" cy="0" rx="14" ry="8" fill="#ffd54f" stroke="#d97706" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="8" ry="5" fill="#f59e0b"/>
  </g>
  
  <!-- Kite body (diamond) -->
  <g transform="translate(256,256) rotate(45)">
    <!-- Shadow -->
    <rect x="-110" y="-105" width="220" height="220" fill="#000000" opacity="0.15" rx="8"/>
    <!-- Main kite -->
    <rect x="-115" y="-115" width="230" height="230" fill="#ffffff" stroke="url(#gold)" stroke-width="10" rx="10"/>
    <!-- Inner highlight -->
    <rect x="-100" y="-100" width="200" height="200" fill="none" stroke="#fef3c7" stroke-width="3" rx="5"/>
  </g>
  
  <!-- Rupee symbol -->
  <g transform="translate(256,256)">
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="#d92b2b" text-anchor="middle">₹</text>
  </g>
  
  <!-- Shine effect -->
  <path d="M 150 150 Q 180 120 210 150" stroke="#ffffff" stroke-width="8" fill="none" opacity="0.6" stroke-linecap="round"/>
</svg>