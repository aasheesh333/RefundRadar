<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Content scaled to adaptive-icon safe zone (center ~66%) -->
  <g transform="translate(256,256) scale(0.68) translate(-256,-256)">
    <!-- Tail strings -->
    <path d="M 256 380 Q 240 420 220 440" stroke="#0f2f57" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M 256 380 Q 270 420 292 445" stroke="#0f2f57" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- Bows on tail -->
    <g transform="translate(220,440) rotate(-20)">
      <ellipse cx="0" cy="0" rx="16" ry="9" fill="#ffd54f" stroke="#d97706" stroke-width="2.5"/>
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="#f59e0b"/>
    </g>
    <g transform="translate(292,445) rotate(20)">
      <ellipse cx="0" cy="0" rx="16" ry="9" fill="#ffd54f" stroke="#d97706" stroke-width="2.5"/>
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="#f59e0b"/>
    </g>
    <g transform="translate(256,465)">
      <ellipse cx="0" cy="0" rx="16" ry="9" fill="#ffd54f" stroke="#d97706" stroke-width="2.5"/>
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="#f59e0b"/>
    </g>
    <!-- Kite diamond -->
    <g transform="translate(200,180) rotate(45)">
      <rect x="-95" y="-95" width="190" height="190" rx="22" fill="#ffffff" stroke="url(#gold)" stroke-width="14"/>
    </g>
    <!-- ₹ symbol -->
    <g transform="translate(200,180)">
      <text x="0" y="42" font-family="Arial, sans-serif" font-size="150" font-weight="bold" fill="#d92b2b" text-anchor="middle">&#8377;</text>
    </g>
  </g>
</svg>
